name: Bug report
description: Report a reproducible problem in Aria
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide a short, reproducible report. Remove secrets and other sensitive data.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and include relevant error messages.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Aria version
      description: Provide the release version or commit when the issue occurred.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and relevant runtime details.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Include sanitized logs or screenshots if they help explain the issue.
      render: shell
    validations:
      required: false
