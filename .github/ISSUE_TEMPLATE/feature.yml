name: Feature request
description: Propose a focused improvement for Aria
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe one focused improvement and the problem it would solve.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you considered.
    validations:
      required: false
